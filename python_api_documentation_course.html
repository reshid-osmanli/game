function anatomyNoteFor(id) {
  const p = ANATOMY_PARTS.find(x => x.id === id);
  return p ? p.note : 'جزء من الـ signature.';
}

/* ============================================================
   SIDEBAR
   ============================================================ */
let currentNav = 'dashboard', currentArg = null;

function buildSidebar() {
  const nav = $('#sidebar-nav');
  let html = '';
  html += navItem('dashboard', 'الرئيسية', '🏠');
  html += `<div class="nav-group-title">الدورة</div>`;
  html += navItem('diagnostic', 'الاختبار التشخيصي', '🧪', null, !!state.diagnostic);
  MODULES.forEach(m => { if (m.diagnostic) return; html += navItem('module', 'الوحدة ' + m.id + ' · ' + m.title, '◆', m.id, moduleCompleted(m)); });
  html += `<div class="nav-group-title">الأدوات</div>`;
  html += navItem('docs', 'عارض التوثيق', '📖');
  html += navItem('sim', 'المحاكي التعليمي', '🧪');
  html += navItem('reference', 'المرجع السريع', '📚');
  html += navItem('anatomy', 'تشريح التوثيق', '🧬');
  html += navItem('objmap', 'خريطة الكائنات', '🗺️');
  html += `<div class="nav-group-title">المختبرات</div>`;
  LABS.forEach(l => html += navItem('lab', l.title, l.ic, l.id, labDone(l.id)));
  html += `<div class="nav-group-title">وحدات مهارية</div>`;
  html += navItem('searchskills', 'كيف تبحث في التوثيق', '🧠');
  html += navItem('debugmindset', 'لا تخمّن — افحص', '🔎');
  html += `<div class="nav-group-title">المشاريع</div>`;
  MINI_PROJECTS.forEach(p => html += navItem('project', p.title, '🧩', p.id, projectDone(p.id)));
  html += navItem('finalproject', 'المشروع النهائي', '🏆', null, !!finalScore());
  html += `<div class="nav-group-title">التقييم</div>`;
  html += navItem('assessment', 'الاختبار النهائي', '🎓', null, !!state.finalAssessment);
  html += navItem('review', 'مراجعة الأخطاء', '🔁');
  html += navItem('knowledge', 'خريطة المعرفة', '🧭');
  html += navItem('progress', 'تقدّمك', '📊');
  html += navItem('certificate', 'الشهادة', '📜', null, certificateEligible());
  nav.innerHTML = html;
}

function navItem(nav, label, ic, arg, done) {
  const active = currentNav === nav && (arg == null || currentArg === String(arg));
  const argAttr = arg != null ? ` data-arg="${escapeHTML(String(arg))}"` : '';
  return `<button class="nav-item ${active ? 'active' : ''}" data-nav="${nav}"${argAttr} aria-current="${active ? 'page' : 'false'}">
    <span class="ic">${ic}</span><span>${escapeHTML(label)}</span>${done ? '<span class="tick">✓</span>' : ''}</button>`;
}

function buildSidebarFoot() {
  const el = $('#sidebar-foot');
  const name = state.profile.name || 'زائر';
  el.innerHTML = `<div class="profile-row"><span class="avatar">${escapeHTML(name.charAt(0).toUpperCase())}</span><span>${escapeHTML(name)}</span></div>
    <div>تعمل دون إنترنت · يُحفظ تقدمك هنا</div>`;
}

function highlightNav(name, params) {
  if (name === 'lesson') { currentNav = 'module'; currentArg = String(params.module); }
  else { currentNav = name; currentArg = (params.arg != null) ? String(params.arg) : (params.module != null ? String(params.module) : null); }
  buildSidebar();
}

/* lab/project completion (derived from persisted question results) */
function labQuestions(id) {
  switch (id) {
    case 'guess': return GUESS_ITEMS.flatMap(g => g.questions);
    case 'explore': return EXPLORE_OBJECTS.flatMap(g => g.questions);
    case 'doclab': return DOCLAB_ITEMS.map(docLabQ);
    case 'errorlab': return ERROR_ITEMS.map(e => e.question);
    case 'discover': return DISCOVER_ITEMS.flatMap(g => g.steps);
    case 'libdiscover': return LIBDISCOVER_ITEMS.flatMap(g => g.steps);
    case 'searchchallenge': return SEARCH_CHALLENGES.map(challengeQ);
    case 'decision': return DECISION_ITEMS.map(decisionQ);
    case 'similar': return SIMILAR_ITEMS.flatMap(g => g.questions);
  }
  return [];
}
function labDone(id) {
  const qs = labQuestions(id);
  if (!qs.length) return false;
  return qs.every(q => { const r = qState(q.id); return r.status === 'correct' || r.status === 'incorrect' || r.status === 'solved'; });
}
function projectDone(id) {
  const p = miniProjectById(id);
  if (!p) return false;
  return p.questions.every(q => { const r = qState(q.id); return r.status === 'correct' || r.status === 'incorrect' || r.status === 'solved'; });
}

/* ============================================================
   GLOBAL EVENT HANDLING (event delegation)
   ============================================================ */
function onGlobalClick(e) {
  // copy buttons
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const pre = copyBtn.closest('.code-head').nextElementSibling;
    if (pre) { navigator.clipboard && navigator.clipboard.writeText(pre.textContent).catch(() => {}); toast('تم نسخ الكود.'); }
    return;
  }
  // navigation
  const navEl = e.target.closest('[data-nav]');
  if (navEl) {
    e.preventDefault();
    const nav = navEl.getAttribute('data-nav');
    const arg = navEl.getAttribute('data-arg');
    if (nav === 'resume') { const r = resumeTarget(); if (r) go(r.nav, r.args); else go('module', { module: 1 }); }
    else if (nav === 'lesson') { const [m, i] = arg.split(':'); go('lesson', { module: parseInt(m, 10), lesson: parseInt(i, 10) }); }
    else if (nav === 'module') go('module', { module: parseInt(arg, 10) });
    else if (nav === 'project') go('project', { id: arg });
    else go(nav, { arg });
    closeSidebarMobile();
    return;
  }
  // doc item (viewer)
  const docItem = e.target.closest('[data-docitem]');
  if (docItem) {
    const id = docItem.getAttribute('data-docitem');
    const det = $('#docs-detail');
    if (det) { det.innerHTML = docDetailHTML(id); det.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    return;
  }
  // actions
  const actEl = e.target.closest('[data-action]');
  if (!actEl) return;
  const action = actEl.getAttribute('data-action');
  const qid = actEl.getAttribute('data-qid');
  switch (action) {
    case 'q-check': doQCheck(qid); break;
    case 'q-hint': doQHint(qid); break;
    case 'q-solution': doQSolution(qid); break;
    case 'q-retry': doQRetry(qid); break;
    case 'q-order': doQOrder(qid, actEl.getAttribute('data-idx')); break;
    case 'reset': resetAll(); break;
    case 'diagnostic-finish': finishDiagnostic(); break;
    case 'assessment-finish': finishAssessment(); break;
    case 'final-finish': finishFinalProject(); break;
    case 'print-cert': window.print(); break;
    case 'sim-run': { const out = runSim($('#sim-input').value); $('#sim-output').innerHTML = simResultHTML(out); break; }
    case 'sim-clear': { $('#sim-input').value = ''; $('#sim-output').innerHTML = ''; break; }
    case 'sim-example': { $('#sim-input').value = actEl.getAttribute('data-ex'); $('#sim-output').innerHTML = ''; break; }
    case 'sim-inline': { const g = GUESS_ITEMS.find(x => x.id === actEl.getAttribute('data-simid')); const el = document.querySelector('[data-sim-out="' + actEl.getAttribute('data-simid') + '"]'); if (g && el) el.innerHTML = simResultHTML(runSim(g.sim)); break; }
    case 'widget-sim-run': { const card = actEl.closest('.card'); const ta = card.querySelector('[data-widget-sim]'); const out = card.querySelector('[data-widget-sim-out]'); if (ta && out) out.innerHTML = simResultHTML(runSim(ta.value)); break; }
    case 'eo-reveal': { const eoid = actEl.getAttribute('data-eoid'); const key = actEl.getAttribute('data-key'); const eo = EXPLORE_OBJECTS.find(x => x.id === eoid); if (eo) { if (!state.labResults[eoid]) state.labResults[eoid] = {}; if (!state.labResults[eoid].revealed) state.labResults[eoid].revealed = {}; state.labResults[eoid].revealed[key] = eo.reveals[key]; saveState(); reRenderCurrent(); } break; }
    case 'docs-open': { docsQuery = actEl.getAttribute('data-docid'); go('docs', { arg: docsQuery }); break; }
    case 'dir-show': { dirCurrentList = DIR_DATA[actEl.getAttribute('data-dir')] || []; renderDirOut(); break; }
    case 'dir-filter': break; // handled in input
    case 'refitem': { const id = actEl.getAttribute('data-refitem') || actEl.closest('[data-refitem]').getAttribute('data-refitem'); const r = REFERENCE_ITEMS.find(x => x.id === id); const det = $('#ref-detail'); if (r && det) det.innerHTML = `<div class="card tight"><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.desc)}</p>${codeBlock(r.example)}</div>`; break; }
    case 'anatomy': { const note = actEl.closest('[data-anatomy-note]') || document.querySelector('[data-anatomy-note]'); if (note) note.textContent = '💡 ' + anatomyNoteFor(actEl.getAttribute('data-anatomy')); break; }
    case 'objmap': { document.querySelectorAll('[data-objmap]').forEach(n => n.classList.remove('active')); actEl.classList.add('active'); break; }
  }
}

function onGlobalInput(e) {
  const t = e.target;
  // question option visual selection handled in change; nothing here for radio/checkbox
  if (t.hasAttribute('data-action') && t.getAttribute('data-action') === 'docs-search') {
    docsQuery = t.value;
    const results = docsSearch(docsQuery, docsCategory);
    const count = $('#docs-count'); if (count) count.textContent = results.length + ' نتيجة';
    const res = $('#docs-results'); if (res) res.innerHTML = results.slice(0, 40).map(docListItem).join('');
    return;
  }
  if (t.hasAttribute('data-action') && t.getAttribute('data-action') === 'live-search') {
    const target = t.getAttribute('data-target');
    const results = docsSearch(t.value, 'all').slice(0, 8);
    const out = document.querySelector('[data-live-results="' + target + '"]');
    if (out) out.innerHTML = results.map(docListItem).join('') || '<div class="small muted">لا نتائج — جرّب كلمة أخرى.</div>';
    return;
  }
  if (t.hasAttribute('data-action') && t.getAttribute('data-action') === 'dir-filter') {
    dirCurrentQuery = t.value.toLowerCase();
    renderDirOut();
    return;
  }
  if (t.hasAttribute('data-reflection')) {
    setReflection(t.getAttribute('data-reflection'), parseInt(t.getAttribute('data-ri'), 10), t.value);
    return;
  }
  if (t.hasAttribute('data-unit-reflection')) {
    setReflection('unit_' + t.getAttribute('data-unit-reflection'), parseInt(t.getAttribute('data-ri'), 10), t.value);
    return;
  }
  if (t.hasAttribute('data-final')) {
    state.finalProject[t.getAttribute('data-final')] = t.value;
    saveState();
    return;
  }
  if (t.hasAttribute('data-action') && t.getAttribute('data-action') === 'profile-name') {
    state.profile.name = t.value;
    saveState();
    buildSidebarFoot();
    return;
  }
}

function onGlobalChange(e) {
  const t = e.target;
  if (t.matches('input[data-qopt]')) {
    const qid = t.getAttribute('data-qopt');
    const block = document.getElementById('qblock-' + qid);
    if (!block) return;
    block.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
    const label = t.closest('.opt');
    if (label) label.classList.add('sel');
    return;
  }
  if (t.matches('input[data-checklist]')) {
    state.checklist.doc = state.checklist.doc || {};
    state.checklist.doc[t.getAttribute('data-checklist')] = t.checked;
    saveState();
    const label = t.closest('.checklist-item');
    if (label) label.classList.toggle('checked', t.checked);
    return;
  }
  if (t.hasAttribute('data-action') && t.getAttribute('data-action') === 'docs-category') {
    docsCategory = t.value;
    const results = docsSearch(docsQuery, docsCategory);
    const count = $('#docs-count'); if (count) count.textContent = results.length + ' نتيجة';
    const res = $('#docs-results'); if (res) res.innerHTML = results.slice(0, 40).map(docListItem).join('');
    return;
  }
}

function onGlobalKeydown(e) {
  if (e.key === 'Enter') {
    const docItem = e.target.closest('[data-docitem]');
    if (docItem) { docItem.click(); e.preventDefault(); return; }
    const ref = e.target.closest('[data-refitem]');
    if (ref) { ref.click(); e.preventDefault(); return; }
  }
  if (e.key === 'Escape') { closeModal(); closeSidebarMobile(); }
}

/* finish handlers */
function finishDiagnostic() {
  const answered = DIAGNOSTIC.questions.filter(q => { const r = qState(q.id); return r.status === 'correct' || r.status === 'incorrect'; }).length;
  if (answered === 0) { toast('أجب سؤالًا واحدًا على الأقل قبل إنهاء الاختبار.'); return; }
  state.diagnostic = computeDiagnostic();
  saveState();
  render('diagnostic', {});
  buildSidebar();
}
function finishAssessment() {
  state.finalAssessment = computeAssessment();
  if (state.finalAssessment.pct >= 60 && !state.certificate) state.certificate = { issued: true, date: new Date().toISOString() };
  saveState();
  render('assessment', {});
  buildSidebar();
}
function finishFinalProject() {
  const score = computeFinalScore();
  state.finalProject.score = score;
  state.finalProject.completed = true;
  if (score.total >= 60 && !state.certificate) state.certificate = { issued: true, date: new Date().toISOString() };
  saveState();
  render('finalproject', {});
  buildSidebar();
  toast('تم احتساب درجة المشروع النهائي.');
}
function resetAll() {
  openModal({
    title: 'إعادة تعيين كل التقدم',
    body: 'سيؤدي هذا إلى حذف كل التقدم المحفوظ من هذا المتصفح: الدروس المكتملة، النتائج، التلميحات، المحاولات، وحالة المشروع النهائي. لا يمكن التراجع عن هذا الإجراء.',
    actions: [
      { id: 'cancel', label: 'إلغاء', cls: 'btn-outline' },
      { id: 'reset', label: 'إعادة التعيين', cls: 'btn-danger', onClick: function () { state = defaultState(); saveState(); currentNav = 'dashboard'; currentArg = null; buildSidebar(); buildSidebarFoot(); go('dashboard', {}); toast('تم حذف كل التقدم.'); } }
    ]
  });
}
function reRenderCurrent() { render(currentNav === 'module' && currentArg ? 'module' : currentNav, currentNav === 'lesson' ? { module: state.current.module, lesson: state.current.lesson } : { arg: currentArg }); }

/* mobile sidebar */
function closeSidebarMobile() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('click', onGlobalClick);
document.addEventListener('input', onGlobalInput);
document.addEventListener('change', onGlobalChange);
document.addEventListener('keydown', onGlobalKeydown);
document.addEventListener('DOMContentLoaded', function () {
  buildSidebar();
  buildSidebarFoot();
  $('#menu-btn').addEventListener('click', function () { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('show'); });
  $('#backdrop').addEventListener('click', closeSidebarMobile);
  const cur = state.current;
  if (cur && cur.module != null) {
    const m = moduleById(cur.module);
    if (m && !m.diagnostic && m.lessons && m.lessons[cur.lesson || 0]) render('lesson', { module: cur.module, lesson: cur.lesson || 0 });
    else render('dashboard', {});
  } else render('dashboard', {});
});
