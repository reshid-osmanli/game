<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>دورة Python APIs وقراءة التوثيق — من الكائنات إلى بناء البرامج</title>
<style>
/* ============ Reset & Tokens ============ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #eef2f8;
  --border: #e2e7ef;
  --border-strong: #c9d2df;
  --text: #1b2430;
  --text-2: #3c4657;
  --muted: #66717f;
  --accent: #3d5afe;
  --accent-2: #2b3fae;
  --accent-soft: #e8ecff;
  --success: #1e7d3a;
  --success-bg: #e6f4ea;
  --danger: #b3261e;
  --danger-bg: #fdecec;
  --warning: #8a5a00;
  --warning-bg: #fff4e0;
  --info-bg: #e8f0fb;
  --info: #1c4f8f;
  --code-bg: #101826;
  --code-fg: #e6edf6;
  --code-muted: #93a4b8;
  --code-accent: #8fb2ff;
  --sidebar-bg: #171e2b;
  --sidebar-fg: #c7d0dd;
  --sidebar-hover: #232d3f;
  --sidebar-active: #2b3fae;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 40px rgba(16,24,40,.16);
  --font-ui: "Segoe UI", system-ui, -apple-system, "Noto Kufi Arabic", "Noto Sans Arabic", "Tahoma", sans-serif;
  --font-mono: "Cascadia Code", "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  --sidebar-w: 288px;
}
html { font-size: 16px; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
a:hover { color: var(--accent-2); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip-link {
  position: absolute; top: -40px; right: 12px; z-index: 2000;
  background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 0 0 8px 8px;
  text-decoration: none; transition: top .15s;
}
.skip-link:focus { top: 0; }

/* ============ Layout ============ */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--sidebar-bg);
  color: var(--sidebar-fg);
  position: fixed; inset-inline-start: 0; top: 0; bottom: 0;
  display: flex; flex-direction: column;
  z-index: 120;
  overflow-y: auto;
  transition: transform .25s ease;
}
.sidebar-brand {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-brand .logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.02rem; color: #fff;
}
.sidebar-brand .logo .glyph {
  width: 34px; height: 34px; border-radius: 9px; flex: 0 0 34px;
  background: linear-gradient(135deg, #4f6ef7, #2b3fae);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 1rem;
  color: #fff;
}
.sidebar-brand .sub { font-size: .78rem; color: #8b98ab; margin-top: 3px; }
.sidebar-nav { padding: 12px 10px 20px; flex: 1; }
.nav-group-title {
  font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
  color: #6f7c8f; margin: 14px 10px 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: start;
  padding: 9px 12px; margin: 1px 0;
  border-radius: 9px; border: none; background: transparent;
  color: var(--sidebar-fg); font: inherit; font-size: .92rem;
  cursor: pointer; text-decoration: none;
}
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--sidebar-active); color: #fff; }
.nav-item .ic { width: 20px; text-align: center; flex: 0 0 20px; opacity: .9; }
.nav-item .tick { margin-inline-start: auto; color: #4ade80; font-size: .9rem; }
.nav-item .count {
  margin-inline-start: auto; background: rgba(255,255,255,.12);
  color: #cdd7e4; font-size: .72rem; padding: 1px 8px; border-radius: 999px;
}
.nav-modules-toggle { cursor: pointer; }
.nav-modules { padding-inline-start: 12px; border-inline-start: 1px solid rgba(255,255,255,.12); margin-inline-start: 16px; }
.sidebar-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.08); font-size: .8rem; color: #8b98ab; }
.sidebar-foot .profile-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sidebar-foot .avatar {
  width: 30px; height: 30px; border-radius: 50%; background: #2b3fae; color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: .8rem;
}
.backdrop { display: none; position: fixed; inset: 0; background: rgba(10,15,25,.5); z-index: 110; }
.main { flex: 1; margin-inline-start: var(--sidebar-w); min-width: 0; }
.topbar {
  display: none;
  align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.topbar .menu-btn {
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 1.15rem; cursor: pointer;
}
.topbar .tt { font-weight: 700; font-size: .98rem; }
.content { max-width: 1000px; margin: 0 auto; padding: 28px 28px 96px; }

/* ============ Typography ============ */
h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 .5em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
.content > h1 { margin-top: .2em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.lead { font-size: 1.03rem; color: var(--text-2); }
.kicker { font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

/* ============ Cards ============ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px; margin: 16px 0;
  box-shadow: var(--shadow);
}
.card.tight { padding: 14px 16px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 16px 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: .9rem;
  padding: 9px 16px; border-radius: 9px; border: 1px solid transparent;
  cursor: pointer; text-decoration: none; transition: background .12s, border-color .12s, transform .05s;
  background: var(--surface-3); color: var(--text);
}
.btn:hover { background: var(--border); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-2); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #166a31; }
.btn-outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
.btn-outline:hover { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-ghost:hover { background: var(--accent-soft); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #8e1c16; }
.btn-sm { padding: 5px 10px; font-size: .82rem; border-radius: 7px; }
.btn-lg { padding: 12px 22px; font-size: 1rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn-row.between { justify-content: space-between; }

/* ============ Badges ============ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2); border: 1px solid var(--border);
}
.badge.b-acc { background: var(--accent-soft); color: var(--accent-2); border-color: #cdd6ff; }
.badge.b-ok { background: var(--success-bg); color: var(--success); border-color: #bfe3ca; }
.badge.b-warn { background: var(--warning-bg); color: var(--warning); border-color: #f0dcae; }
.badge.b-danger { background: var(--danger-bg); color: var(--danger); border-color: #f3c2c2; }
.badge.b-dark { background: #1f2430; color: #fff; }
.badge.lvl { font-family: var(--font-mono); letter-spacing: .02em; }
.diff-1 { background: #e0f2e9; color: #1c6b43; border-color: #b9e2c8; }
.diff-2 { background: #fff3d6; color: #7c5900; border-color: #f0d99a; }
.diff-3 { background: #fde4df; color: #a13427; border-color: #f3bdb4; }

/* ============ Code blocks ============ */
pre {
  direction: ltr; text-align: left;
  background: var(--code-bg); color: var(--code-fg);
  border-radius: 10px; padding: 14px 16px; overflow-x: auto;
  font-family: var(--font-mono); font-size: .88rem; line-height: 1.6;
  margin: 12px 0; position: relative;
  border: 1px solid #1c2636;
}
pre code { font-family: inherit; white-space: pre; }
.code-head {
  display: flex; align-items: center; justify-content: space-between;
  direction: ltr;
  background: #162032; color: var(--code-muted);
  font-family: var(--font-mono); font-size: .74rem;
  padding: 6px 12px; border-radius: 10px 10px 0 0; margin-bottom: -12px;
  border: 1px solid #1c2636; border-bottom: none;
}
.code-head + pre { border-radius: 0 0 10px 10px; margin-top: 0; }
.copy-btn {
  background: transparent; border: none; color: var(--code-muted);
  font-family: inherit; font-size: .74rem; cursor: pointer; padding: 2px 6px; border-radius: 5px;
}
.copy-btn:hover { color: #fff; background: #232d3f; }
.out-block {
  direction: ltr; text-align: left;
  background: #0c1622; color: #9fe8b0;
  border: 1px solid #1c2636; border-radius: 10px;
  padding: 12px 16px; font-family: var(--font-mono); font-size: .88rem;
  margin: 10px 0; overflow-x: auto; white-space: pre;
}
.out-block .lbl { color: #5d7189; font-size: .72rem; letter-spacing: .06em; }
code.inline {
  direction: ltr; unicode-bidi: isolate;
  font-family: var(--font-mono); font-size: .86em;
  background: var(--surface-3); color: #24314a;
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
}
.token-kw { color: #c792ea; } .token-str { color: #a5d6a7; } .token-num { color: #f78c6c; }
.token-fn { color: #82aaff; } .token-cm { color: #5d7189; font-style: italic; } .token-op { color: #89ddff; }
.token-cls { color: #ffcb6b; } .token-blt { color: #89ddff; }

/* ============ Callouts ============ */
.callout {
  display: flex; gap: 12px; padding: 13px 16px; border-radius: 10px;
  margin: 14px 0; border: 1px solid var(--border); background: var(--surface-2);
}
.callout .co-ic { font-size: 1.2rem; line-height: 1.3; }
.callout .co-body { flex: 1; }
.callout .co-title { font-weight: 700; margin-bottom: 2px; }
.callout.info { background: var(--info-bg); border-color: #cfe0f2; }
.callout.info .co-title { color: var(--info); }
.callout.warn { background: var(--warning-bg); border-color: #f0dcae; }
.callout.warn .co-title { color: var(--warning); }
.callout.tip { background: var(--success-bg); border-color: #bfe3ca; }
.callout.tip .co-title { color: var(--success); }
.callout.danger { background: var(--danger-bg); border-color: #f3c2c2; }
.callout.danger .co-title { color: var(--danger); }

/* ============ Lists & tables ============ */
ul.clean { margin: 8px 0; padding-inline-start: 22px; }
ul.clean li { margin: 4px 0; }
ul.nobull { list-style: none; padding-inline-start: 0; }
table.doc-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .9rem; }
.doc-table th, .doc-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: start; }
.doc-table th { background: var(--surface-2); font-weight: 700; }
.doc-table td code { font-size: .82rem; }

/* ============ Progress bars ============ */
.progress { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress > span {
  display: block; height: 100%; background: linear-gradient(90deg, #4f6ef7, #3d5afe);
  border-radius: 999px; transition: width .4s ease;
}
.progress.thin { height: 6px; }
.progress-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.progress-row .progress { flex: 1; }
.progress-row .pval { font-size: .8rem; color: var(--muted); min-width: 44px; text-align: end; }

/* ============ Question blocks ============ */
.qblock {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); margin: 18px 0; overflow: hidden;
  box-shadow: var(--shadow);
}
.qblock .qhead {
  display: flex; gap: 10px; align-items: flex-start; padding: 14px 18px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
}
.qblock .qnum {
  flex: 0 0 auto; min-width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent-2); font-weight: 700; font-size: .85rem;
  display: grid; place-items: center;
}
.qblock .qmeta { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.qblock .qbody { padding: 16px 18px; }
.qblock .qprompt { font-weight: 600; margin-bottom: 12px; }
.qstate { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; }
.qstate.unanswered { color: var(--muted); }
.qstate.correct { color: var(--success); }
.qstate.incorrect { color: var(--danger); }
.qstate.solved { color: var(--warning); }

.opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; margin: 6px 0; border: 1px solid var(--border);
  border-radius: 9px; cursor: pointer; transition: background .1s, border-color .1s;
  background: var(--surface);
}
.opt:hover { background: var(--surface-2); border-color: var(--border-strong); }
.opt input { margin-top: 4px; }
.opt .opt-txt { flex: 1; }
.opt .opt-code { direction: ltr; unicode-bidi: isolate; text-align: left; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.good { border-color: #4caf72; background: var(--success-bg); }
.opt.bad { border-color: #e0877f; background: var(--danger-bg); }
.opt.disabled { pointer-events: none; opacity: .85; }
.feedback { border-radius: 9px; padding: 12px 14px; margin: 12px 0; font-size: .92rem; }
.feedback.ok { background: var(--success-bg); border: 1px solid #bfe3ca; }
.feedback.no { background: var(--danger-bg); border: 1px solid #f3c2c2; }
.feedback.info { background: var(--info-bg); border: 1px solid #cfe0f2; }
.feedback .fb-title { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.explanation { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 9px; padding: 12px 14px; margin-top: 10px; font-size: .92rem; }
input[type=text], textarea, select {
  font: inherit; font-size: .9rem; padding: 9px 12px;
  border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface);
  width: 100%; color: var(--text);
}
input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 56px; }
.field { margin: 10px 0; }
.field label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 5px; }
.field .hint-txt { font-size: .78rem; color: var(--muted); }

/* ============ Hint / solution ============ */
.hint-panel { border: 1px solid #f0dcae; background: var(--warning-bg); border-radius: 9px; padding: 12px 14px; margin: 10px 0; font-size: .9rem; }
.hint-panel .hp-title { font-weight: 700; color: var(--warning); display: flex; gap: 6px; align-items: center; }
.solution-panel { border: 1px solid #bfe3ca; background: var(--success-bg); border-radius: 9px; padding: 12px 14px; margin: 10px 0; font-size: .92rem; }

/* ============ Steps / flow ============ */
.flow { display: flex; flex-direction: column; gap: 2px; margin: 16px 0; }
.flow .fstep {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
}
.flow .fstep.done { border-color: #bfe3ca; background: var(--success-bg); }
.flow .fstep.done .fnum { background: var(--success); color: #fff; }
.flow .fnum {
  flex: 0 0 28px; height: 28px; border-radius: 50%;
  background: var(--surface-3); color: var(--text-2); font-weight: 700; font-size: .82rem;
  display: grid; place-items: center;
}
.flow .farr { text-align: center; color: var(--muted); font-size: 1rem; line-height: 1; padding: 1px 0; }
.flow .fbody { flex: 1; }
.flow .ftitle { font-weight: 700; }
.flow .fdesc { font-size: .85rem; color: var(--muted); }

/* ============ Tabs / segmented ============ */
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; background: var(--surface-3); padding: 4px; border-radius: 10px; }
.seg button {
  border: none; background: transparent; font: inherit; font-size: .86rem; font-weight: 600;
  padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--text-2);
}
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg button:hover { color: var(--text); }

/* ============ Docs viewer ============ */
.doc-search { display: flex; gap: 8px; margin: 12px 0; }
.doc-search input { flex: 1; }
.doc-item {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 8px 0;
  cursor: pointer; background: var(--surface); transition: border-color .1s, background .1s;
}
.doc-item:hover { border-color: var(--accent); background: var(--surface-2); }
.doc-item .doc-name { font-family: var(--font-mono); direction: ltr; text-align: left; font-weight: 700; color: var(--accent-2); }
.doc-item .doc-desc { font-size: .87rem; color: var(--text-2); }
.doc-kw { display: inline-block; font-family: var(--font-mono); font-size: .72rem; background: var(--surface-3); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; margin: 2px 2px 0 0; direction: ltr; }
.sig-line {
  direction: ltr; text-align: left; font-family: var(--font-mono); font-size: .9rem;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0;
  white-space: pre-wrap; overflow-x: auto;
}
.sig-part { cursor: pointer; padding: 1px 2px; border-radius: 4px; border-bottom: 1px dashed transparent; }
.sig-part:hover { background: var(--accent-soft); border-bottom-color: var(--accent); }
.sig-part.kw { color: #7b4fc7; font-weight: 700; }
.sig-part.nm { color: #1c4f8f; }
.sig-part.ty { color: #1e7d3a; }
.sig-part.df { color: #8a5a00; }
.sig-part.rt { color: #b3261e; font-weight: 700; }
.anatomy-note { border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px; padding: 10px 14px; margin: 8px 0; font-size: .9rem; }

/* ============ Simulator ============ */
.sim-input { width: 100%; direction: ltr; text-align: left; font-family: var(--font-mono); font-size: .9rem; min-height: 96px; }
.sim-result { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; }
.sim-result .sim-out { direction: ltr; text-align: left; font-family: var(--font-mono); background: var(--code-bg); color: var(--code-fg); padding: 12px 16px; white-space: pre-wrap; }
.sim-result .sim-note { padding: 10px 16px; font-size: .9rem; background: var(--surface-2); border-top: 1px solid var(--border); }
.sim-notice { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; margin: 8px 0; }

/* ============ Object map ============ */
.objmap { display: flex; flex-direction: column; gap: 4px; margin: 16px 0; }
.objmap .onode {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
}
.objmap .onode .otitle { font-weight: 700; }
.objmap .onode code { font-size: .82rem; }
.objmap .onode.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.objmap .oarrow { text-align: center; color: var(--muted); }
.objmap .otype { font-family: var(--font-mono); font-size: .76rem; color: var(--success); direction: ltr; }

/* ============ Certificate ============ */
.cert {
  background: #fff; border: 2px solid #c8d2e2; border-radius: 18px;
  padding: 40px; max-width: 720px; margin: 20px auto; text-align: center;
  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.cert::before { content: ""; position: absolute; inset: 0; border: 8px solid #eef2f8; border-radius: 14px; pointer-events: none; }
.cert .c-badge { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 14px; background: linear-gradient(135deg,#4f6ef7,#2b3fae); color:#fff; display: grid; place-items: center; font-family: var(--font-mono); font-size: 2rem; }
.cert h2 { font-size: 1.7rem; }

<script>
'use strict';
/* ============================================================
   Python APIs & Documentation — Interactive Course
   Single-file, offline, localStorage-backed SPA.
   ============================================================ */

/* ---------- Tiny utilities ---------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Inline markdown: `code`, **bold**, [text](link) is left as-is */
function inlineMD(text) {
  let s = escapeHTML(text);
  s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

function normText(s) {
  return String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' ');
}
function containsAny(text, needles) {
  const t = normText(text);
  return needles.some(n => t.includes(normText(n)));
}

/* Minimal, dependency-free Python syntax highlighting.
   Heuristic only — safe to fail silently. */
function highlightPy(code) {
  let s = escapeHTML(code);
  s = s.replace(/(#[^\n]*)/g, '<span class="token-cm">$1</span>');
  s = s.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g, '<span class="token-str">$1</span>');
  s = s.replace(/\b(True|False|None)\b/g, '<span class="token-kw">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="token-num">$1</span>');
  s = s.replace(/\b(def|return|class|import|from|if|elif|else|for|while|try|except|raise|with|as|in|not|and|or|is|lambda|pass|yield|global|nonlocal|break|continue)\b/g, '<span class="token-kw">$1</span>');
  s = s.replace(/\b([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()/g, '<span class="token-fn">$1</span>');
  return s;
}

function codeBlock(code, opts) {
  opts = opts || {};
  const label = opts.label ? `<div class="code-head"><span>${escapeHTML(opts.label)}</span><button class="copy-btn" data-copy>نسخ</button></div>` : '';
  return `${label}<pre><code class="py">${highlightPy(code)}</code></pre>`;
}
function outBlock(text, label) {
  return `<div class="out-block"><div class="lbl">${escapeHTML(label || 'OUTPUT')}</div>${escapeHTML(text)}</div>`;
}

/* ---------- Toast ---------- */
let _toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Modal ---------- */
function openModal(opts) {
  const root = $('#modal-root');
  const actions = (opts.actions || []).map(a =>
    `<button class="btn ${a.cls || 'btn-outline'}" data-modal-act="${a.id}">${escapeHTML(a.label)}</button>`).join('');
  root.innerHTML = `
    <div class="modal-backdrop" data-modal-bg>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">${escapeHTML(opts.title || '')}</h3>
        <div class="modal-body">${opts.body || ''}</div>
        <div class="modal-actions">${actions}</div>
      </div>
    </div>`;
  root.querySelector('[data-modal-bg]').addEventListener('click', e => {
    if (e.target === e.currentTarget && opts.dismissable !== false) closeModal();
  });
  root.querySelectorAll('[data-modal-act]').forEach(b => b.addEventListener('click', () => {
    const act = opts.actions.find(a => a.id === b.getAttribute('data-modal-act'));
    closeModal();
    if (act && act.onClick) act.onClick();
  }));
  const first = root.querySelector('.modal-actions .btn');
  if (first) first.focus();
}
function closeModal() { $('#modal-root').innerHTML = ''; }

/* ---------- State & persistence ---------- */
const STORAGE_KEY = 'py_api_doc_course_v1';

function defaultState() {
  return {
    profile: { name: '', startDate: new Date().toISOString(), lastVisit: null },
    diagnostic: null,          // { score, max, level, strengths, weaknesses, answers, doneAt }
    completedLessons: {},      // lessonId -> timestamp
    lessonResults: {},         // lessonId -> {score,max,hints,solutions,attempts,answered}
    questionResults: {},       // questionId -> {status:'correct'|'incorrect'|'solved',hints,attempts,last}
    labResults: {},            // labId -> {completed, score, max, ...}
    projectResults: {},        // projectId -> {completed, score, answers}
    finalProject: {},          // { stage1..5 answers, scores, completed }
    finalAssessment: null,     // {score,max,level,answers}
    certificate: null,         // {issued, date}
    current: { module: null, lesson: null },  // resume point
    mistakes: {},              // concept -> {count, questionIds:[]}
    checklist: {},             // key -> {itemId:true}
    order: {},                 // for order-question shuffled state
    userName: ''
  };
}

let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // merge with defaults to tolerate schema additions
    const base = defaultState();
    return deepMerge(base, parsed);
  } catch (e) { return defaultState(); }
}
function deepMerge(base, extra) {
  if (extra == null) return base;
  if (Array.isArray(base)) return extra;
  if (typeof base === 'object' && typeof extra === 'object') {
    const out = Array.isArray(extra) ? extra.slice() : Object.assign({}, base);
    for (const k of Object.keys(extra)) out[k] = deepMerge(base[k], extra[k]);
    return out;
  }
  return extra;
}
function saveState() {
  try {
    state.profile.lastVisit = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('تعذّر حفظ التقدّم (قد يكون التخزين المحلي معطّلًا).');
  }
}
function touch() { saveState(); }

/* ---------- Routing ---------- */
const routes = {};   // name -> render fn
function route(name, fn) { routes[name] = fn; }
function go(name, params, replace) {
  const p = Object.assign({}, params || {});
  if (name === 'lesson') {
    state.current.module = p.module;
    state.current.lesson = p.lesson;
  }
  touch();
  render(name, p);
}
function render(name, params) {
  const content = $('#content');
  content.scrollTop = 0;
  window.scrollTo(0, 0);
  const fn = routes[name] || routes['dashboard'];
  content.innerHTML = fn(params || {}) || '';
  content.focus({ preventScroll: true });
  highlightNav(name, params || {});
  $('#topbar-title').textContent = currentTitle(name, params || {});
}

function currentTitle(name, p) {
  switch (name) {
    case 'dashboard': return 'لوحة التحكم';
    case 'module': return `الوحدة ${p.module} — ${moduleById(p.module).title}`;
    case 'lesson': {
      const m = moduleById(p.module);
      const l = m && m.lessons[p.lesson];
      return l ? l.title : 'درس';
    }
    case 'lab': return (labById(p.lab) || {}).title || 'مختبر';
    case 'project': return (miniProjectById(p.id) || {}).title || 'مشروع';
    case 'finalproject': return 'المشروع النهائي';
    case 'assessment': return 'الاختبار النهائي';
    case 'certificate': return 'الشهادة';
    case 'docs': return 'عارض التوثيق';
    case 'anatomy': return 'تشريح التوثيق';
    case 'objmap': return 'خريطة الكائنات';
    case 'reference': return 'المرجع السريع';
    case 'sim': return 'محاكي بايثون التعليمي';
    case 'guess': return 'خمّن قبل التشغيل';
    case 'explore': return 'استكشف كائنًا مجهولًا';
    case 'doclab': return 'مختبر التوثيق';
    case 'errorlab': return 'مختبر قراءة الأخطاء';
    case 'discover': return 'مختبر اكتشاف الدوال';
    case 'libdiscover': return 'مختبر اكتشاف المكتبات';
    case 'searchchallenge': return 'تحدي البحث في التوثيق';
    case 'decision': return 'مهام اتخاذ القرار';
    case 'similar': return 'تحدي الواجهات المتشابهة';
    case 'searchskills': return 'كيف تبحث في التوثيق';
    case 'debugmindset': return 'لا تخمّن — افحص';
    case 'review': return 'مراجعة الأخطاء';
    case 'knowledge': return 'خريطة المعرفة';
    case 'progress': return 'تقدّمك';
    case 'profile': return 'الملف الشخصي';
    default: return 'بايثون · APIs والتوثيق';
  }
}

/* ============================================================
   LOCAL DOCUMENTATION DATA  (offline, embedded)
   Used by: Documentation Viewer, Documentation Lab, Search
   challenges, discovery labs, final project, reference sheet.
   ============================================================ */
const DOCS = {};
function addDoc(id, o) {
  DOCS[id] = Object.assign({
    id, name: id, kind: 'function', category: '', signature: id + '(...)',
    description: '', parameters: [], returns: { type: 'Any', description: '' },
    exceptions: [], notes: '', examples: [], related: [], keywords: []
  }, o);
  const kws = (o.keywords || []).concat(id.split('.'), (o.category || '').split('.'));
  DOCS[id].keywords = Array.from(new Set(kws.map(k => k.toLowerCase()).filter(Boolean)));
}
function docEx(code, out) { return { code, out }; }

/* ---------- Built-in inspection & core ---------- */
addDoc('type', { category: 'builtins', signature: 'type(object) -> type',
  description: 'ترجع نوع الكائن (object) ككائن من نوع `type`. هذا هو أول أداة تفتيش يجب أن تستخدمها عندما لا تعرف نوع القيمة.',

  parameters: [

addDoc('dir', { category: 'builtins', signature: 'dir([object]) -> list[str]',

   QUESTION ENGINE — render, check, hints, solution, scoring
   ============================================================ */
const CONCEPT_NAMES = {
  'types': 'الأنواع وأنواع البيانات', 'type': 'type()', 'dir': 'dir()', 'help': 'help()',
  'return': 'القيم المرجعة', 'methods': 'الطرق', 'signature': 'تواقيع الدوال',

  'stdlib': 'المكتبة القياسية', 'api-discovery': 'اكتشاف الـ API', 'indexing': 'الفهرسة',
  'errors': 'قراءة الأخطاء', 'search': 'البحث في التوثيق', 'debug': 'الفحص بدل التخمين'
};
function conceptName(c) { return CONCEPT_NAMES[c] || c || 'المفهوم'; }
function qMaxPoints(q) { return ({ 1: 10, 2: 15, 3: 20 })[q.difficulty] || 10; }

function qState(qid) {
  return state.questionResults[qid] || { status: 'unanswered', hints: 0, attempts: 0, solved: false, points: 0, max: 0, correct: false, sel: null, given: null };
}
function setQ(qid, patch) {
  const r = qState(qid);
  Object.assign(r, patch);
  state.questionResults[qid] = r;
  saveState();
}

function recordMistake(q, wrong) {
  if (!wrong) return;
  const c = q.concept || 'general';
  if (!state.mistakes[c]) state.mistakes[c] = { count: 0, module: q.module || 10, ids: [] };
  state.mistakes[c].count++;
  if (state.mistakes[c].ids.indexOf(q.id) === -1) state.mistakes[c].ids.push(q.id);
}

function hintText(q, level) {
  if (q.hints && q.hints[level - 1]) return q.hints[level - 1];
  const cn = conceptName(q.concept);
  if (level === 1) return 'تلميح خفيف: ركّز على مفهوم "' + cn + '". اقرأ نص السؤال حرفيًا.';
  const m = moduleById(q.module);
  if (level === 2) return 'توجيه: راجع Module ' + (q.module || '') + ' — ' + (m ? m.title : '') + '، وافتح عارض التوثيق إن لزم.';
  if (q.type === 'mcq' || q.type === 'tf') return 'شبه الحل: الإجابة الصحيحة هي: ' + String(q.options[q.answer]) + '.';
  if (q.type === 'multi') return 'شبه الحل: الخيارات الصحيحة هي: ' + q.answer.map(i => String(q.options[i])).join(' ، ') + '.';
  if (q.type === 'fill') return 'شبه الحل: الإجابة المتوقعة: ' + (q.answer || '').toString() + '.';
  return 'شبه الحل: اقرأ الشرح في نهاية السؤال أو افتح التوثيق المرتبط.';
}

/* Compute points at the moment a question becomes correct. */
function computePoints(q, r) {
  if (r.solved) return 0;
  const max = qMaxPoints(q);
  let p = max - (r.hints || 0) * 0.25 * max - (r.attempts || 0) * 0.15 * max;
  return Math.max(Math.round(max * 0.25), Math.round(p));
}

function reviewLinkHtml(modId) {
  const m = moduleById(modId);
  return m ? `<a href="#" data-nav="module" data-arg="${modId}">Module ${modId} — ${escapeHTML(m.title)}</a>` : '';
}

function qStatusBadge(r) {
  const map = {
    unanswered: ['unanswered', 'غير مجاب'],
    correct: ['correct', 'صحيح'],
    incorrect: ['incorrect', 'غير صحيح'],
    solved: ['solved', 'تم كشف الحل']
  };
  const [cls, txt] = map[r.status] || map.unanswered;
  return `<span class="qstate ${cls}">● ${txt}</span>`;
}

/* ---------- Render one question block ---------- */
function renderQuestion(q, opts) {
  opts = opts || {};
  const r = qState(q.id);
  const num = opts.index != null ? opts.index + 1 : '';
  const locked = r.status === 'correct' || r.status === 'solved';
  const diff = DIFF[q.difficulty] || DIFF[1];

  let body = '';
  if (q.code) body += codeBlock(q.code);
  body += `<div class="qprompt">${inlineMD(q.prompt || '')}</div>`;

  if (q.type === 'mcq' || q.type === 'tf') {
    body += `<div class="opts" role="radiogroup" aria-label="خيارات">`;
    const order = optOrder(q);
    order.forEach((origIdx, dispIdx) => {
      const opt = q.options[origIdx];
      let cls = 'opt';
      if (r.status === 'correct' && origIdx === q.answer) cls += ' good';
      if (r.status === 'incorrect' && r.sel === dispIdx && origIdx !== q.answer) cls += ' bad';
      const checked = (r.sel === dispIdx && (r.status === 'correct' || r.status === 'incorrect')) ? 'checked' : '';
      body += `<label class="opt ${cls} ${locked ? 'disabled' : ''}"><input type="radio" name="q_${q.id}" value="${dispIdx}" data-orig="${origIdx}" data-qopt="${q.id}" ${checked} ${locked ? 'disabled' : ''}> <span class="opt-txt opt-code">${inlineMD(String(opt))}</span></label>`;
    });
    body += `</div>`;
  } else if (q.type === 'multi') {
    body += `<div class="opts" role="group">`;
    const order = optOrder(q);
    order.forEach((origIdx, dispIdx) => {
      const opt = q.options[origIdx];
      const sel = Array.isArray(r.sel) && r.sel.indexOf(dispIdx) !== -1;
      const good = r.status === 'correct' && q.answer.indexOf(origIdx) !== -1;
      const bad = r.status === 'incorrect' && sel && q.answer.indexOf(origIdx) === -1;
      body += `<label class="opt ${good ? 'good' : ''} ${bad ? 'bad' : ''} ${locked ? 'disabled' : ''}"><input type="checkbox" value="${dispIdx}" data-orig="${origIdx}" data-qopt="${q.id}" ${sel ? 'checked' : ''} ${locked ? 'disabled' : ''}> <span class="opt-txt opt-code">${inlineMD(String(opt))}</span></label>`;
    });
    body += `</div>`;
  } else if (q.type === 'fill') {
    const val = r.given != null ? escapeHTML(r.given) : '';
    body += `<div class="field"><input type="text" data-qfill="${q.id}" value="${val}" placeholder="اكتب إجابتك..." ${locked ? 'disabled' : ''} dir="ltr" style="text-align:left;font-family:var(--font-mono)"></div>`;
  } else if (q.type === 'order') {
    body += renderOrderUI(q, r, locked);
  } else if (q.type === 'fields') {
    body += renderFieldsUI(q, r, locked);
  }

  // feedback / explanation / solution
  if (r.status === 'correct') {
    body += `<div class="feedback ok"><div class="fb-title">✔ إجابة صحيحة · +${r.points} نقطة</div>${q.explanation ? `<div class="small muted">${inlineMD(q.explanation)}</div>` : ''}</div>`;
  } else if (r.status === 'incorrect') {
    const rec = state.mistakes[q.concept] || {};
    const review = rec.count >= 2 ? `<div class="feedback info" style="margin-top:8px">🔁 <strong>Review Recommended:</strong> أخطأت في هذا المفهوم ${rec.count} مرات — راجع ${reviewLinkHtml(rec.module || q.module)}.</div>` : '';
    body += `<div class="feedback no"><div class="fb-title">✘ غير صحيح — حاول مجددًا</div>${q.explanation ? `<div class="small muted">${inlineMD(q.explanation)}</div>` : ''}</div>${review}`;
  }
  if (r.status === 'solved') {
    body += `<div class="solution-panel"><div class="fb-title">💡 الحل</div>${inlineMD(q.solution || q.explanation || '')}${q.explanation ? `<div class="small muted" style="margin-top:6px">${inlineMD(q.explanation)}</div>` : ''}</div>`;
  }

  // hints
  if (r.hints > 0) {
    const shown = [];
    for (let i = 1; i <= r.hints && i <= 3; i++) shown.push(`<div class="hint-panel"><div class="hp-title">💡 تلميح ${i}</div>${inlineMD(hintText(q, i))}</div>`);
    body += shown.join('');
  }

  // controls
  let controls = '';
  if (!locked) {
    controls += `<button class="btn btn-primary btn-sm" data-action="q-check" data-qid="${q.id}">تحقق</button> `;
    if (r.hints < 3) controls += `<button class="btn btn-outline btn-sm" data-action="q-hint" data-qid="${q.id}">تلميح ${r.hints + 1}</button> `;
    controls += `<button class="btn btn-ghost btn-sm" data-action="q-solution" data-qid="${q.id}">إظهار الحل</button>`;
  } else if (r.status === 'correct') {
    controls += `<span class="small muted">أُجيب بنجاح.</span>`;
  } else if (r.status === 'solved') {
    controls += `<button class="btn btn-outline btn-sm" data-action="q-retry" data-qid="${q.id}">محاولة من جديد (بدون نقاط)</button>`;
  }

  return `<div class="qblock" id="qblock-${q.id}" data-qid="${q.id}">
    <div class="qhead">
      <span class="qnum">${num}</span>
      <div style="flex:1;min-width:0">
        <div class="small muted" style="font-weight:700">${escapeHTML(q.concept ? conceptName(q.concept) : '')}</div>
      </div>
      <div class="qmeta">
        <span class="badge ${diff.cls}">${diff.txt}</span>
        <span class="badge b-acc">${qMaxPoints(q)} نقطة</span>
        ${qStatusBadge(r)}
      </div>
    </div>
    <div class="qbody">${body}<div class="btn-row">${controls}</div></div>
  </div>`;
}

function renderOrderUI(q, r, locked) {
  const cur = Array.isArray(state.order[q.id]) ? state.order[q.id] : null;
  let picked;
  if (cur) picked = cur.slice();
  else if (r.picked) picked = r.picked.slice();
  else picked = [];

  const available = [];
  for (let i = 0; i < q.items.length; i++) if (picked.indexOf(i) === -1) available.push(i);

  let html = '<div class="small muted" style="margin-bottom:8px">اضغط العناصر بالترتيب الصحيح:</div>';
  html += '<div class="order-picked" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">';
  picked.forEach((idx, pos) => {
    html += `<button type="button" class="btn btn-outline btn-sm order-chip" data-action="q-order" data-qid="${q.id}" data-idx="${idx}" style="justify-content:flex-start;text-align:start" ${locked ? 'disabled' : ''}><span style="font-weight:800;margin-inline-end:8px">${pos + 1}</span>${inlineMD(String(q.items[idx]))}</button>`;
  });
  html += '</div>';
  html += '<div class="small muted">المتبقي:</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
  available.forEach(idx => {
    html += `<button type="button" class="btn btn-ghost btn-sm order-chip" data-action="q-order" data-qid="${q.id}" data-idx="${idx}" ${locked ? 'disabled' : ''}>${inlineMD(String(q.items[idx]))}</button>`;
  });
  html += '</div>';
  return html;
}

function renderFieldsUI(q, r, locked) {
  let html = '<div class="small muted" style="margin-bottom:8px">أكمل الحقول اعتمادًا على قراءتك للتوثيق:</div>';
  q.fields.forEach(f => {
    const res = r.fieldResults && r.fieldResults[f.key];
    let cls = '';
    let mark = '';
    if (res && res.correct) { cls = 'good'; mark = ' ✔'; }
    else if (res && !res.correct) { cls = 'bad'; mark = ' ✘'; }
    if (f.type === 'select') {
      const val = (r.fieldValues && r.fieldValues[f.key]) || '';
      html += `<div class="field"><label>${escapeHTML(f.label)}${mark}</label>
        <select data-qfield="${q.id}" data-fkey="${f.key}" ${locked ? 'disabled' : ''} class="${cls}">
          <option value="">— اختر —</option>
          ${(f.options || []).map(o => `<option value="${escapeHTML(o)}" ${val === o ? 'selected' : ''}>${escapeHTML(o)}</option>`).join('')}
        </select></div>`;
    } else {
      const val = (r.fieldValues && r.fieldValues[f.key]) != null ? escapeHTML(r.fieldValues[f.key]) : '';
      html += `<div class="field"><label>${escapeHTML(f.label)}${mark}</label>
        <input type="text" data-qfield="${q.id}" data-fkey="${f.key}" value="${val}" placeholder="${escapeHTML(f.placeholder || '')}" ${locked ? 'disabled' : ''} dir="auto" class="${cls}"></div>`;
    }
  });
  if (r.status === 'correct' || r.status === 'incorrect') {
    const cnt = Object.values(r.fieldResults || {}).filter(x => x.correct).length;
    const tot = q.fields.length;
    html += `<div class="feedback ${cnt === tot ? 'ok' : 'no'}"><div class="fb-title">${cnt === tot ? '✔ كل الحقول صحيحة' : '✘ صحيح ' + cnt + ' من ' + tot}</div></div>`;
  }
  return html;
}

function shuffleIndices(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Deterministic per-question option order (anti-memorization) — stable within a session. */
function optOrder(q) {
  const key = 'optorder_' + q.id;
  if (Array.isArray(state.order[key])) return state.order[key];
  const n = (q.options || []).length;
  const order = Array.from({ length: n }, (_, i) => i);
  let h = 0;
  for (const c of String(q.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--) {
    h = (h * 1103515245 + 12345) >>> 0;
    const j = h % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  state.order[key] = order;
  saveState();
  return order;
}

/* ---------- Evaluation ---------- */
function evaluateQuestion(q, r, block) {
  if (q.type === 'mcq' || q.type === 'tf') {
    const el = block.querySelector(`input[name="q_${q.id}"]:checked`);
    if (!el) { toast('اختر إجابة أولًا.'); return null; }
    const sel = parseInt(el.value, 10);
    const order = optOrder(q);
    return { sel, correct: order[sel] === q.answer };
  }
  if (q.type === 'multi') {
    const order = optOrder(q);
    const sels = $$(`input[data-qopt="${q.id}"]:checked`, block).map(x => parseInt(x.value, 10));
    if (!sels.length) { toast('اختر إجابة واحدة على الأقل.'); return null; }
    const origs = sels.map(s => order[s]);
    const correct = origs.length === q.answer.length && q.answer.every(a => origs.indexOf(a) !== -1);
    return { sel: sels, correct };
  }
  if (q.type === 'fill') {
    const el = block.querySelector(`[data-qfill="${q.id}"]`);
    if (!el || !normText(el.value)) { toast('اكتب إجابة أولًا.'); return null; }
    const given = el.value;
    const correct = containsAny(given, q.accept || [q.answer]);
    return { given, correct };
  }
  if (q.type === 'order') {
    const picked = state.order[q.id];
    if (!picked || picked.length !== q.items.length) { toast('رتّب كل العناصر أولًا.'); return null; }
    const correct = picked.every((v, i) => v === q.order[i]);
    return { picked, correct };
  }
  if (q.type === 'fields') {
    const values = {}, results = {};
    let all = true, answered = false;
    q.fields.forEach(f => {
      const el = block.querySelector(`[data-qfield="${q.id}"][data-fkey="${f.key}"]`);
      const val = el ? el.value : '';
      values[f.key] = val;
      let correct = false;
      if (f.type === 'select') correct = normText(val) === normText(f.answer);
      else correct = !!val && containsAny(val, f.accept || []);
      if (val) answered = true;
      results[f.key] = { correct };
      if (!correct) all = false;
    });
    if (!answered) { toast('أكمل الحقول أولًا.'); return null; }
    return { fieldValues: values, fieldResults: results, correct: all };
  }
  return null;
}

/* ---------- Actions ---------- */
function doQCheck(qid) {
  const q = findQuestion(qid);
  if (!q) return;
  const r = qState(qid);
  const block = document.getElementById('qblock-' + qid);
  if (!block) return;
  const ev = evaluateQuestion(q, r, block);
  if (!ev) return;
  if (ev.sel !== undefined) setQ(qid, { sel: ev.sel });
  if (ev.given !== undefined) setQ(qid, { given: ev.given });
  if (ev.fieldValues) setQ(qid, { fieldValues: ev.fieldValues });
  if (ev.picked) { state.order[qid] = ev.picked; }

  if (ev.correct) {
    const fresh = qState(qid);
    const pts = computePoints(q, fresh);
    setQ(qid, { status: 'correct', correct: true, points: pts, max: qMaxPoints(q), fieldResults: ev.fieldResults || fresh.fieldResults });
    refreshQBlock(qid);
    toast('✔ إجابة صحيحة!');
  } else {
    const fresh = qState(qid);
    setQ(qid, { status: 'incorrect', attempts: (fresh.attempts || 0) + 1, fieldResults: ev.fieldResults });
    recordMistake(q, true);
    refreshQBlock(qid);
    toast('✘ غير صحيح، راجع وحاول مجددًا.');
  }
}

function doQHint(qid) {
  const q = findQuestion(qid);
  const r = qState(qid);
  if (r.hints >= 3) return;
  setQ(qid, { hints: (r.hints || 0) + 1 });
  refreshQBlock(qid);
}

function doQSolution(qid) {
  const q = findQuestion(qid);
  setQ(qid, { status: 'solved', solved: true, points: 0, max: qMaxPoints(q) });
  refreshQBlock(qid);
}

function doQRetry(qid) {
  setQ(qid, { status: 'unanswered', solved: false, points: 0, sel: null, given: null, fieldValues: null, fieldResults: null });
  refreshQBlock(qid);
}

function doQOrder(qid, idx) {
  const cur = (state.order[qid] && state.order[qid].slice()) || null;
  const q = findQuestion(qid);
  if (!cur) { state.order[qid] = [parseInt(idx, 10)]; }
  else {
    const i = cur.indexOf(parseInt(idx, 10));
    if (i === -1) cur.push(parseInt(idx, 10));
    else cur.splice(i, 1);
    state.order[qid] = cur;
  }
  saveState();
  refreshQBlock(qid);
}

function refreshQBlock(qid) {
  const old = document.getElementById('qblock-' + qid);
  if (!old) return;
  const q = findQuestion(qid);
  const tmp = document.createElement('div');
  tmp.innerHTML = renderQuestion(q, {});
  const node = tmp.firstElementChild;
  old.parentNode.replaceChild(node, old);
}

/* Find a question by id across all datasets. */
function findQuestion(qid) {
  const pools = [
    ...DIAGNOSTIC.questions,
    ...allLessonQuestions(),
    ...GUESS_ITEMS.reduce((a, g) => a.concat(g.questions), []),
    ...EXPLORE_OBJECTS.reduce((a, g) => a.concat(g.questions), []),
    ...DOCLAB_ITEMS.map(d => ({ id: d.id, type: 'fields', concept: 'documentation', module: 10, difficulty: d.diff, prompt: d.intro, fields: d.fields, explanation: d.explanation, solution: d.path, max: 0 })),
    ...ERROR_ITEMS.map(e => e.question),
    ...DISCOVER_ITEMS.reduce((a, g) => a.concat(g.steps), []),
    ...LIBDISCOVER_ITEMS.reduce((a, g) => a.concat(g.steps), []),
    ...DECISION_ITEMS.map(d => ({ id: d.id, type: 'mcq', concept: 'documentation', module: 10, difficulty: d.diff, prompt: d.problem, options: d.options, answer: d.answer, explanation: d.explanation, solution: d.explanation })),
    ...SIMILAR_ITEMS.reduce((a, g) => a.concat(g.questions), []),
    ...MINI_PROJECTS.reduce((a, g) => a.concat(g.questions), []),
    ...FINAL_PROJECT.stages.reduce((a, s) => a.concat(s.questions || []), []),
    ...FINAL_ASSESSMENT.questions,
    ...SEARCH_SKILLS.questions,
    ...DEBUG_MINDSET.questions,
    ...SEARCH_CHALLENGES.map(c => ({ id: c.id, type: 'fill', concept: 'search', module: 10, difficulty: c.diff, prompt: c.goal, accept: c.alt, answer: c.docId, solution: c.path, explanation: c.path }))
  ];
  return pools.find(p => p.id === qid) || null;
}

function allLessonQuestions() {
  const out = [];
  MODULES.forEach(m => (m.lessons || []).forEach(l => (l.questions || []).forEach(q => out.push(q))));
  return out;
}

/* ---------- Completion helpers ---------- */
function lessonCompleted(lesson) {
  const qs = lesson.questions || [];
  if (!qs.length) return true;
  return qs.every(q => {
    const r = qState(q.id);
    return r.status === 'correct' || r.status === 'solved' || r.status === 'incorrect' || r.attempts > 0;
  });
}
function moduleCompleted(m) {
  if (m.diagnostic) return !!state.diagnostic;
  if (!m.lessons.length) return false;
  return m.lessons.every(lessonCompleted);
}

function qCounts(list) {
  const qs = list.filter(q => q.type !== 'fields');
  let answered = 0, points = 0, max = 0;
  qs.forEach(q => {
    const r = qState(q.id);
    if (r.status === 'correct') { answered++; points += r.points; max += r.max || qMaxPoints(q); }
    else if (r.status === 'solved' || r.status === 'incorrect') { answered++; max += qMaxPoints(q); }
    else max += qMaxPoints(q);
  });
  return { answered, total: qs.length, points, max };
}

function lessonById(lid) {

function miniProjectById(id) { return MINI_PROJECTS.find(p => p.id === id); }

function iconFor(kind) {
  return ({ info: 'ℹ️', warn: '⚠️', tip: '💡', danger: '🚫' })[kind] || 'ℹ️';
}

function flowHTML(items) {
  return '<div class="flow">' + items.map((it, i) => {
    const title = typeof it === 'string' ? it : it.title;
    const desc = typeof it === 'string' ? '' : (it.desc || '');
    const done = it.done ? ' done' : '';
    return `<div class="fstep${done}"><span class="fnum">${i + 1}</span><div class="fbody"><div class="ftitle">${escapeHTML(title)}</div>${desc ? `<div class="fdesc">${inlineMD(desc)}</div>` : ''}</div></div>` +
      (i < items.length - 1 ? '<div class="farr">↓</div>' : '');
  }).join('') + '</div>';
}

function renderBlocks(blocks, opts) {
  opts = opts || {};
  return (blocks || []).map(b => {
    switch (b.t) {
      case 'p': return `<p>${inlineMD(b.text)}</p>`;
      case 'h': return `<h3>${inlineMD(b.text)}</h3>`;
      case 'code': return codeBlock(b.code, { label: b.label }) + (b.out ? outBlock(b.out) : '');
      case 'list': return '<ul class="clean">' + b.items.map(i => `<li>${inlineMD(i)}</li>`).join('') + '</ul>';
      case 'callout': return `<div class="callout ${b.kind || 'info'}"><span class="co-ic">${iconFor(b.kind)}</span><div class="co-body"><div class="co-title">${escapeHTML(b.title || '')}</div><div>${inlineMD(b.text || '')}</div></div></div>`;
      case 'table': return `<table class="doc-table"><thead><tr>${b.headers.map(h => `<th>${inlineMD(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${inlineMD(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      case 'flow': return flowHTML(b.items);
      case 'widget': return widgetHTML(b);
      default: return '';
    }
  }).join('');
}

/* question buckets for scoring */
function docLabQ(d) { return { id: d.id, type: 'fields', concept: 'documentation', module: 10, difficulty: d.diff || 2, prompt: d.intro, fields: d.fields, explanation: d.explanation, solution: d.path }; }
function decisionQ(d) { return { id: d.id, type: 'mcq', concept: 'documentation', module: 10, difficulty: d.diff || 2, prompt: d.problem, options: d.options, answer: d.answer, explanation: d.explanation, solution: d.explanation }; }
function challengeQ(c) { return { id: c.id, type: 'fill', concept: 'search', module: 10, difficulty: c.diff || 2, prompt: c.goal, accept: c.alt, answer: c.docId, solution: c.path, explanation: c.path }; }

const BUCKETS = {
  quiz: () => [].concat(
    allLessonQuestions(),
    GUESS_ITEMS.flatMap(g => g.questions),
    SEARCH_SKILLS.questions, DEBUG_MINDSET.questions,

  ),

    DOCLAB_ITEMS.map(docLabQ), DECISION_ITEMS.map(decisionQ),

  ),
  explore: () => [].concat(
    EXPLORE_OBJECTS.flatMap(g => g.questions),
    DISCOVER_ITEMS.flatMap(g => g.steps), LIBDISCOVER_ITEMS.flatMap(g => g.steps)
  ),
  projects: () => MINI_PROJECTS.flatMap(g => g.questions)
};

function qCounts(list) {
  let answered = 0, points = 0, max = 0;
  list.forEach(q => {
    const r = qState(q.id);
    max += qMaxPoints(q);
    if (r.status === 'correct') { answered++; points += r.points; }
    else if (r.status === 'solved' || r.status === 'incorrect') { answered++; }
  });
  return { answered, total: list.length, points, max };
}

function computeStats() {
  const lessons = MODULES.reduce((a, m) => a.concat(m.lessons || []), []);
  const quiz = qCounts(BUCKETS.quiz());
  const docs = qCounts(BUCKETS.docs());
  const explore = qCounts(BUCKETS.explore());
  const projects = qCounts(BUCKETS.projects());
  const final = finalScore();
  const stats = {
    modulesCompleted: MODULES.filter(moduleCompleted).length,
    modulesTotal: MODULES.length,
    lessonsCompleted: lessons.filter(lessonCompleted).length,
    lessonsTotal: lessons.length,
    quiz, docs, explore, projects, final,
    diagnostic: state.diagnostic,
    certificate: state.certificate
  };
  stats.overall = overallProgress(stats);
  return stats;
}

function overallProgress(stats) {
  const parts = [];
  parts.push([stats.lessonsCompleted / Math.max(1, stats.lessonsTotal), 0.30]);
  parts.push([ratio(stats.quiz), 0.15]);
  parts.push([ratio(stats.docs), 0.12]);
  parts.push([ratio(stats.explore), 0.12]);
  parts.push([ratio(stats.projects), 0.11]);
  parts.push([stats.final ? stats.final.total / 100 : 0, 0.20]);
  const total = parts.reduce((s, [r, w]) => s + r * w, 0);
  return Math.round(total * 100);
}
function ratio(c) { return c.max ? c.points / c.max : 0; }

function progressBar(pct, opts) {
  opts = opts || {};
  const cls = opts.thin ? 'progress thin' : 'progress';
  return `<div class="${cls}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${opts.label || 'تقدم'}"><span style="width:${Math.max(0, Math.min(100, pct))}%"></span></div>`;
}

function computeDiagnostic() {
  let correct = 0, points = 0, max = 0;
  const byConcept = {};
  DIAGNOSTIC.questions.forEach(q => {
    const r = qState(q.id);
    max += qMaxPoints(q);
    if (r.status === 'correct') { correct++; points += r.points; }
    const c = q.concept || 'general';
    if (!byConcept[c]) byConcept[c] = { correct: 0, total: 0 };
    byConcept[c].total++;
    if (r.status === 'correct') byConcept[c].correct++;
  });
  const total = DIAGNOSTIC.questions.length;
  const pct = Math.round(correct / total * 100);
  const strengths = Object.entries(byConcept).filter(([, v]) => v.correct === v.total).map(([k]) => k);
  const weaknesses = Object.entries(byConcept).filter(([, v]) => v.correct < v.total).map(([k]) => k);
  const level = pct >= 85 ? 'Intermediate' : pct >= 60 ? 'Advanced Beginner — متقدم' : 'Advanced Beginner';
  return { correct, total, points, max, pct, strengths, weaknesses, level, doneAt: new Date().toISOString() };
}

route('progress', function () {
  const st = computeStats();
  const allRes = Object.values(state.questionResults || {});
  const hintsUsed = allRes.reduce((s, r) => s + (r.hints || 0), 0);
  const solvedRevealed = allRes.reduce((s, r) => s + (r.solved ? 1 : 0), 0);
  const rows = [
    ['الدروس المكتملة', `${st.lessonsCompleted}/${st.lessonsTotal}`, st.lessonsCompleted / Math.max(1, st.lessonsTotal) * 100],
    ['نقاط التمارين (Quiz)', `${st.quiz.points}/${st.quiz.max}`, ratio(st.quiz) * 100],
    ['نقاط التوثيق (Documentation)', `${st.docs.points}/${st.docs.max}`, ratio(st.docs) * 100],
    ['نقاط الاستكشاف (Exploration)', `${st.explore.points}/${st.explore.max}`, ratio(st.explore) * 100],
    ['المشاريع المصغرة', `${st.projects.points}/${st.projects.max}`, ratio(st.projects) * 100],
    ['المشروع النهائي', st.final ? `${st.final.total}/100` : '—', st.final ? st.final.total : 0]
  ];
  return `<div class="crumb"><a href="#" data-nav="dashboard">الرئيسية</a> › تقدّمك</div>
    <h1>📊 تقدّمك</h1>
    <div class="stat-grid">
      <div class="stat"><div class="sv">${st.overall}%</div><div class="sk">الإنجاز الكلي</div></div>
      <div class="stat"><div class="sv">${st.quiz.answered}/${st.quiz.total}</div><div class="sk">أسئلة مجابة</div></div>
      <div class="stat"><div class="sv">${Object.keys(state.questionResults || {}).length}</div><div class="sk">إجمالي التفاعلات</div></div>
      <div class="stat"><div class="sv">${hintsUsed}</div><div class="sk">التلميحات المستخدمة</div></div>
      <div class="stat"><div class="sv">${solvedRevealed}</div><div class="sk">الحلول المكشوفة</div></div>
    </div>
    <div class="card">
      ${rows.map(([label, val, pct]) => `<div class="progress-row" style="flex-direction:column;align-items:stretch;gap:4px">
        <div style="display:flex;justify-content:space-between"><span>${label}</span><span class="pval">${val}</span></div>
        ${progressBar(pct, { thin: true, label })}
      </div>`).join('')}
    </div>
    <div class="card">
      <h3>دقة الإجابة (Accuracy)</h3>
      <p class="small muted">نسبة الصحيح من الأسئلة المجابة في كل قسم.</p>
      ${['quiz', 'docs', 'explore', 'projects'].map(k => {
        const c = st[k];
        const acc = c.answered ? Math.round((c.points / Math.max(1, c.answered * 10)) * 10) : 0;
        return `<div class="progress-row"><span style="min-width:130px">${({ quiz: 'التمارين', docs: 'التوثيق', explore: 'الاستكشاف', projects: 'المشاريع' })[k]}</span>
          ${progressBar(Math.min(100, acc * 10), { thin: true })}<span class="pval">${acc}/10</span></div>`;
      }).join('')}
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" data-nav="knowledge">خريطة المعرفة</button>
      <button class="btn btn-danger" data-action="reset">إعادة تعيين كل التقدم</button>
    </div>`;
});

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('ar', { dateStyle: 'medium', timeStyle: 'short' }); }
  catch (e) { return iso; }
}

/* ============================================================
   DOC EVIDENCE (renders a doc entry from DOCS)
   ============================================================ */
function docEvidence(docId) {
  const d = DOCS[docId];
  if (!d) return '';
  return `<div class="sig-line">${escapeHTML(d.signature)}</div>
    <p>${inlineMD(d.description)}</p>
    ${d.parameters && d.parameters.length ? `<div class="small muted"><strong>المعاملات:</strong> ${d.parameters.map(p => `${p.name}${p.optional ? ' (اختياري=' + (p.default || '') + ')' : ' (إلزامي)'} : ${p.type}`).join('، ')}</div>` : ''}
    <div class="small muted"><strong>القيمة المرجعة:</strong> ${d.returns.type} — ${escapeHTML(d.returns.description)}</div>
    ${d.exceptions && d.exceptions.length ? `<div class="small muted"><strong>الاستثناءات:</strong> ${d.exceptions.map(e => e.type + (e.when ? ' (' + e.when + ')' : '')).join('، ')}</div>` : ''}
    ${d.examples && d.examples.length ? d.examples.map(ex => codeBlock(ex.code) + (ex.out ? outBlock(ex.out) : '')).join('') : ''}`;
}

function computeFinalScore() {
  const s = FINAL_PROJECT.stages;
  const ok = q => q && qState(q.id).status === 'correct';
  const att = q => q && (qState(q.id).status === 'correct' || qState(q.id).status === 'incorrect');
  const s3 = s[2], s4 = s[3];
  const discovery = Math.round((s[1].questions.filter(ok).length / s[1].questions.length) * 20);
  const docs = Math.round((s3.questions.filter(ok).length / s3.questions.length) * 20);
  const params = ok(s3.questions[0]) ? 15 : (att(s3.questions[0]) ? 8 : 0);
  const ret = ok(s3.questions[1]) ? 15 : (att(s3.questions[1]) ? 8 : 0);
  const errors = (ok(s3.questions[2]) ? 5 : 0) + (s4.questions[0] && ok(s4.questions[0]) ? 5 : 0);
  const code = (state.finalProject.code || '').toLowerCase();
  const need = s[3].codeArea.check;
  const hits = need.filter(k => code.includes(k.toLowerCase())).length;
  const impl = Math.min(15, Math.round(hits / need.length * 12) + (s4.questions[1] && ok(s4.questions[1]) ? 3 : 0));
  const fpQs = FINAL_PROJECT.stages.flatMap(x => x.questions || []);

  if (obj.t === 'str') {
    switch (name) {
      case 'upper': return V('str', obj.v.toUpperCase());
      case 'lower': return V('str', obj.v.toLowerCase());
      case 'capitalize': return V('str', obj.v.charAt(0).toUpperCase() + obj.v.slice(1).toLowerCase());
      case 'title': return V('str', obj.v.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()));
      case 'strip': return V('str', obj.v.trim());
      case 'replace': { const old = a0.v, nw = args[1] ? args[1].v : ''; return V('str', obj.v.split(old).join(nw)); }
      case 'split': { const sep = a0 ? a0.v : undefined; return V('list', (sep === undefined ? obj.v.trim().split(/\s+/) : obj.v.split(sep)).map(s => V('str', s))); }
      case 'join': { const items = (a0 && a0.t === 'list') ? a0.v : args; return V('str', items.map(x => x.v).join(obj.v)); }
      case 'find': return V('int', obj.v.indexOf(a0.v));
      case 'index': { const i = obj.v.indexOf(a0.v); if (i === -1) simErr('ValueError: substring not found'); return V('int', i); }
      case 'isdigit': return V('bool', obj.v.length > 0 && /^\d+$/.test(obj.v));
      case 'startswith': return V('bool', obj.v.startsWith(a0.v));
      case 'endswith': return V('bool', obj.v.endsWith(a0.v));
      case 'count': return V('int', obj.v.split(a0.v).length - 1);
    }
    simErr('الطريقة ' + name + ' غير مدعومة في المحاكي على str');
  }
  if (obj.t === 'list') {
    switch (name) {
      case 'append': obj.v.push(a0); return V('none', null);
      case 'extend': if (a0.t === 'list') a0.v.forEach(x => obj.v.push(x)); return V('none', null);
      case 'insert': obj.v.splice(args[0].v, 0, args[1]); return V('none', null);
      case 'remove': { const i = obj.v.findIndex(x => x.v === a0.v); if (i === -1) simErr('ValueError: list.remove(x): x not in list'); obj.v.splice(i, 1); return V('none', null); }
      case 'pop': { const i = a0 ? a0.v : obj.v.length - 1; const x = obj.v.splice(i, 1)[0]; if (!x) simErr('IndexError: pop from empty list'); return x; }
      case 'index': return V('int', obj.v.findIndex(x => x.v === a0.v));
      case 'count': return V('int', obj.v.filter(x => x.v === a0.v).length);
      case 'sort': obj.v.sort((x, y) => (x.v > y.v ? 1 : -1)); return V('none', null);
      case 'reverse': obj.v.reverse(); return V('none', null);
      case 'copy': return V('list', obj.v.slice());
      case 'clear': obj.v.length = 0; return V('none', null);
    }
    simErr('الطريقة ' + name + ' غير مدعومة في المحاكي على list');
  }
  if (obj.t === 'dict') {
    switch (name) {
      case 'keys': return V('dict_keys', obj.v.map(e => e[0]));
      case 'values': return V('dict_values', obj.v.map(e => e[1]));
      case 'items': return V('dict_items', obj.v.map(e => [e[0], e[1]]));
      case 'get': { const key = a0.v; const def = args[1] || V('none', null); const e = obj.v.find(p => p[0].v === key); return e ? e[1] : def; }
      case 'pop': { const i = obj.v.findIndex(p => p[0].v === a0.v); if (i === -1) simErr("KeyError: '" + a0.v + "'"); return obj.v.splice(i, 1)[0][1]; }
      case 'update': if (a0 && a0.t === 'dict') a0.v.forEach(e => { const i = obj.v.findIndex(p => p[0].v === e[0].v); if (i >= 0) obj.v[i][1] = e[1]; else obj.v.push([e[0], e[1]]); }); return V('none', null);
    }
    simErr('الطريقة ' + name + ' غير مدعومة في المحاكي على dict');
  }
  if (obj.t === 'set') {
    switch (name) {
      case 'add': if (!obj.v.some(x => x.v === a0.v)) obj.v.push(a0); return V('none', null);
      case 'remove': { const i = obj.v.findIndex(x => x.v === a0.v); if (i === -1) simErr('KeyError: element not in set'); obj.v.splice(i, 1); return V('none', null); }
      case 'discard': { const i = obj.v.findIndex(x => x.v === a0.v); if (i >= 0) obj.v.splice(i, 1); return V('none', null); }
    }
    simErr('الطريقة ' + name + ' غير مدعومة على set');
  }
  simErr('لا توجد طريقة ' + name + ' على ' + obj.t);
}

const BUILTINS = {
  type: (args) => V('type', args[0] ? (args[0].t === 'none' ? 'NoneType' : args[0].t) : 'NoneType'),
  isinstance: (args, env) => { const v = args[0], t = args[1]; return V('bool', t.t === 'type' && (v.t === t.v || (t.v === 'float' && v.t === 'int'))); },
  len: (args) => { const v = args[0]; if (['str', 'list', 'tuple', 'set', 'dict', 'dict_keys', 'dict_values', 'dict_items'].includes(v.t)) return V('int', v.v.length); simErr('TypeError: object of type ' + v.t + ' has no len()'); },
  int: (args) => { const v = args[0]; if (v.t === 'int') return v; if (v.t === 'float') return V('int', Math.trunc(v.v)); if (v.t === 'str') { const n = Number(v.v.trim()); if (!Number.isInteger(n)) simErr("ValueError: invalid literal for int() with base 10: '" + v.v + "'"); return V('int', n); } simErr('int() لا يقبل ' + v.t); },
  float: (args) => { const v = args[0]; if (v.t === 'float') return v; if (v.t === 'int') return V('float', v.v); if (v.t === 'str') { const n = Number(v.v); if (isNaN(n)) simErr("ValueError: could not convert string to float: '" + v.v + "'"); return V('float', n); } simErr('float() لا يقبل ' + v.t); },
  str: (args) => V('str', pyRepr(args[0]).replace(/^'|'$/g, '')),
  list: (args) => { const v = args[0]; if (['list', 'tuple', 'set', 'dict_keys', 'dict_values', 'dict_items'].includes(v.t)) return V('list', v.v.slice()); if (v.t === 'str') return V('list', v.v.split('').map(c => V('str', c))); simErr('list() لا يقبل ' + v.t); },
  tuple: (args) => V('tuple', args[0].v.slice()),
  set: (args) => { const seen = []; args[0].v.forEach(x => { if (!seen.some(s => s.v === x.v)) seen.push(x); }); return V('set', seen); },
  abs: (args) => num(Math.abs(args[0].v)),
  sum: (args) => { let s = 0; args[0].v.forEach(x => s += x.v); return num(s); },
  min: (args) => args[0].v.reduce((a, b) => a.v <= b.v ? a : b),
  max: (args) => args[0].v.reduce((a, b) => a.v >= b.v ? a : b),
  sorted: (args) => V('list', args[0].v.slice().sort((a, b) => a.v > b.v ? 1 : -1)),
  round: (args) => { const n = args[0].v; const d = args[1] ? args[1].v : 0; const f = Math.round(n * Math.pow(10, d)) / Math.pow(10, d); return d === 0 ? V('int', f) : V('float', f); }
};

function splitTopLevel(s) {
  const parts = []; let depth = 0, cur = '', inStr = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) { cur += c; if (c === inStr) inStr = null; continue; }
    if (c === '"' || c === "'") { inStr = c; cur += c; continue; }
    if (c === '(' || c === '[' || c === '{') depth++;
    if (c === ')' || c === ']' || c === '}') depth--;
    if (c === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts;
}

const SIM_NOTES = [
  [/\.upper\(\)/, 'upper() ترجع نسخة جديدة بأحرف كبيرة (str). النص الأصلي لا يتغير.'],
  [/\.lower\(\)/, 'lower() ترجع نسخة بأحرف صغيرة (str).'],
  [/\.split\(/, 'split() تقسم النص وترجع قائمة (list).'],
  [/\.append\(/, 'append() تضيف عنصرًا للنهاية وتعدّل القائمة في مكانها، وترجع None!'],
  [/\.sort\(\)/, 'sort() ترتب القائمة في مكانها وترجع None (ليست قيمة).'],
  [/\.pop\(\)/, 'pop() تحذف وترجع العنصر (الأخير افتراضيًا).'],
  [/\.keys\(\)/, 'keys() ترجع كائن عرض للمفاتيح (وليس list) — حوّله بـ list() إن أردت قائمة.'],
  [/\.replace\(/, 'replace(old, new) تستبدل وتعود بنص جديد.'],
  [/\.find\(/, 'find() ترجع فهرس أول ظهور، أو -1 إن لم يوجد.'],
  [/^type\(|^\s*type\(/, 'type() ترجع كائن النوع (type object) — وليس نصًا.'],
  [/isinstance\(/, 'isinstance() تتحقق من النوع وترجع True/False — الأفضل للشروط.'],
  [/^len\(|^\s*len\(/, 'len() ترجع عدد العناصر/الأحرف.'],
  [/^sorted\(|^\s*sorted\(/, 'sorted() ترجع قائمة جديدة مرتبة دون تغيير الأصل.'],
  [/int\(/, 'int() تحوّل نصًا/عشريًا إلى عدد صحيح.'],
  [/get\(/, 'get(key, default) ترجع قيمة المفتاح أو default دون KeyError.']
];
function explainSim(line, value) {
  for (const [re, note] of SIM_NOTES) { if (re.test(line)) return note; }
  if (value && value.t === 'type') return 'هذه هي أداة معرفة النوع — قارنها بـ isinstance().';
  return '';
}

function runSim(code) {
  const env = {};
  const results = [];
  const lines = code.split('\n');
  for (const raw of lines) {
    const line = raw.replace(/#.*$/, '').trim();
    if (!line) continue;
    try {
      if (line.startsWith('print(') && line.endsWith(')')) {
        const inner = line.slice(6, -1);
        const vals = splitTopLevel(inner).map(a => pyRepr(evalExpr(a, env)));
        results.push({ kind: 'print', text: vals.join(' ') });
      } else {
        const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
        if (m) {
          const val = evalExpr(m[2], env);
          env[m[1]] = val;
          results.push({ kind: 'assign', name: m[1], value: val });
        } else {
          const val = evalExpr(line, env);
          results.push({ kind: 'expr', value: val, note: explainSim(line, val) });
        }
      }
    } catch (e) {
      results.push({ kind: 'error', text: e.message });
    }
  }
  return results;
}
function evalExpr(src, env) {
  const toks = lex(src);
  if (!toks.length) simErr('تعبير فارغ');
  const p = new Parser(toks, env);
  const v = p.parseExpr();
  return v;
}

function simResultHTML(results) {
  if (!results.length) return '';
  return results.map(r => {
    if (r.kind === 'print') return `<div class="out-block">${escapeHTML(r.text)}</div>`;
    if (r.kind === 'assign') return `<div class="out-block"><span class="lbl">${escapeHTML(r.name)} =</span> ${escapeHTML(pyRepr(r.value))}  <span class="lbl">(${escapeHTML(pyType(r.value))})</span></div>`;
    if (r.kind === 'error') return `<div class="out-block" style="color:#ff9c9c">خطأ: ${escapeHTML(r.text)}</div>`;
    const note = r.note ? `<div class="sim-note">💡 ${escapeHTML(r.note)}</div>` : '';
    return `<div class="out-block">${escapeHTML(pyRepr(r.value))}  <span class="lbl">→ ${escapeHTML(r.value.t === 'none' ? 'None' : pyType(r.value))}</span></div>${note}`;
  }).join('');
}

function docsSearch(q, cat) {
  const t = normText(q);
  return Object.values(DOCS).filter(d => {
    const inCat = cat === 'all' || d.category === cat;
    if (!inCat) return false;
    if (!t) return true;
    const hay = (d.id + ' ' + d.name + ' ' + d.description + ' ' + (d.keywords || []).join(' ')).toLowerCase();
    return hay.includes(t) || t.split(' ').every(w => hay.includes(w));
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function docListItem(d) {
  return `<div class="doc-item" data-docitem="${d.id}" role="button" tabindex="0">
    <div class="doc-name">${escapeHTML(d.name)}</div>
    <div class="doc-desc">${inlineMD(d.description)}</div>
    <div class="doc-kw">${escapeHTML(d.kind)}</div><span class="doc-kw">${escapeHTML(d.category)}</span>
    <div class="sig-line" style="margin-top:6px">${escapeHTML(d.signature)}</div>
  </div>`;
}

}

});

/* Reference sheet */

/* ============================================================
   WIDGETS (inline in lessons)
   ============================================================ */
function widgetHTML(b) {
  if (b.id === 'sim') {
    return `<div class="card tight"><div class="small muted" style="margin-bottom:8px">جرّب بنفسك (محاكاة تعليمية — ليست Python حقيقية):</div>
      <textarea class="sim-input" data-widget-sim dir="ltr" style="text-align:left">${escapeHTML(b.code || '')}</textarea>
      <div class="btn-row"><button class="btn btn-primary btn-sm" data-action="widget-sim-run">▶ تشغيل</button></div>
      <div class="sim-result" data-widget-sim-out></div></div>`;
  }
  if (b.id === 'dirExplorer') return dirExplorerHTML();
  if (b.id === 'anatomy') return renderAnatomy();
  if (b.id === 'checklist') return checklistHTML();
  return '';
}

const DIR_DATA = {
  str: ['capitalize', 'casefold', 'count', 'endswith', 'find', 'format', 'index', 'isalpha', 'isdigit', 'islower', 'isspace', 'isupper', 'join', 'lower', 'lstrip', 'replace', 'rstrip', 'split', 'splitlines', 'startswith', 'strip', 'title', 'upper', 'zfill', '__len__', '__str__'],
  list: ['append', 'clear', 'copy', 'count', 'extend', 'index', 'insert', 'pop', 'remove', 'reverse', 'sort', '__len__'],
  dict: ['clear', 'copy', 'fromkeys', 'get', 'items', 'keys', 'pop', 'popitem', 'setdefault', 'update', 'values', '__len__'],
  hello: ['capitalize', 'casefold', 'count', 'endswith', 'find', 'index', 'join', 'lower', 'replace', 'split', 'startswith', 'strip', 'title', 'upper']
};
let dirCurrentList = null, dirCurrentQuery = '';

function dirExplorerHTML() {
  const saved = state.checklist.dir || {};
  const targets = ['upper', 'lower', 'append', 'split', 'keys', 'values'];
  return `<div class="card tight">
    <div class="small muted" style="margin-bottom:8px">جرّب dir() على أنواع مختلفة، ثم ابحث داخل النتيجة:</div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" data-action="dir-show" data-dir="str">dir(str)</button>
      <button class="btn btn-outline btn-sm" data-action="dir-show" data-dir="list">dir(list)</button>
      <button class="btn btn-outline btn-sm" data-action="dir-show" data-dir="dict">dir(dict)</button>
      <button class="btn btn-outline btn-sm" data-action="dir-show" data-dir="hello">dir("hello")</button>
    </div>
    <div class="field"><label>ابحث داخل القائمة (مثل: upper):</label>
      <input type="text" data-action="dir-filter" placeholder="اكتب كلمة للبحث..." dir="ltr" style="font-family:var(--font-mono)"></div>
    <div data-dir-out class="out-block" style="min-height:44px">اختر نوعًا أعلاه لعرض قائمة أسماء الطرق/السمات.</div>
    <div class="small muted" style="margin-top:10px">🎯 تحدٍّ: ابحث عن هذه العناصر (ستُعلَّم تلقائيًا عند ظهورها):</div>
    <div class="btn-row">${targets.map(t => `<span class="badge ${saved[t] ? 'b-ok' : ''}" data-dir-target="${t}">${saved[t] ? '✓ ' : ''}${t}</span>`).join('')}</div>
  </div>`;
}
function renderDirOut() {
  const el = document.querySelector('[data-dir-out]');
  if (!el) return;
  if (!dirCurrentList) { el.textContent = 'اختر نوعًا لعرض قائمة الطرق/السمات.'; return; }
  let list = dirCurrentList;
  if (dirCurrentQuery) list = list.filter(x => x.includes(dirCurrentQuery));
  el.textContent = list.join('\n') || '(لا نتائج)';
  const shown = new Set(list);
  ['upper', 'lower', 'append', 'split', 'keys', 'values'].forEach(t => {
    if (shown.has(t)) { state.checklist.dir = state.checklist.dir || {}; state.checklist.dir[t] = true; }
  });
  saveState();
  document.querySelectorAll('[data-dir-target]').forEach(b => {
    const t = b.getAttribute('data-dir-target');
    if (state.checklist.dir && state.checklist.dir[t]) { b.classList.add('b-ok'); b.textContent = '✓ ' + t; }
  });
}

function checklistHTML() {
  const saved = state.checklist.doc || {};
  const doneN = DOC_CHECKLIST.filter(it => saved[it.id]).length;
  const items = DOC_CHECKLIST.map(it => {
    const checked = !!saved[it.id];
    return `<label class="checklist-item ${checked ? 'checked' : ''}"><input type="checkbox" data-checklist="${it.id}" ${checked ? 'checked' : ''}> <span class="cl-label">${escapeHTML(it.ar)}</span><span class="cl-en">${escapeHTML(it.en)}</span></label>`;
  }).join('');
  return `<div class="card tight"><div class="small muted" style="margin-bottom:8px">قائمة التحقق الدائمة عند قراءة أي دالة — ${doneN}/${DOC_CHECKLIST.length}:</div>${items}</div>`;
}

function renderAnatomy() {
  const parts = ANATOMY_PARTS;
  return `<div class="card tight"><div class="small muted" style="margin-bottom:8px">اضغط كل جزء لتفهمه:</div>
    <div class="sig-line" style="font-size:1rem">
      <span class="sig-part kw">my_function</span><span class="sig-part">(</span>
      <span class="sig-part nm" data-anatomy="value">value</span><span class="sig-part">: </span><span class="sig-part ty" data-anatomy="int">int</span><span class="sig-part">, </span>
      <span class="sig-part nm" data-anatomy="mode">mode</span><span class="sig-part">: </span><span class="sig-part ty">str</span><span class="sig-part"> = </span><span class="sig-part df" data-anatomy="fast">"fast"</span><span class="sig-part">) </span>
      <span class="sig-part">-&gt; </span><span class="sig-part rt" data-anatomy="ret">list[str]</span>
    </div>
